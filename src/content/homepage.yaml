introduction:
  kicker: 'What this is'
  title: 'Data science on deadline'
  firstParagraph: 'In this hands-on introduction to data journalism, students will learn how to blend cutting-edge statistical analysis with time-tested reporting techniques.'
  secondParagraph: 'You will practice the fundamental skills of the craft by working through the full arc of data-driven stories, together in class and then on your own. By the end of the six-week course, you will be ready to pitch a professional editor.'
  quote: "To cope with the acceleration of social change in today's world, journalism must become social science in a hurry."
  quoteAttribution: 'Philip Meyer'

skills:
  kicker: "What we'll cover"
  title: 'Fundamental skills'
  description: "You'll get multiple rounds of practice applying the key techniques common to every data story."
  items:
    - title: 'Identifying measurable questions'
      icon: 'Lightbulb'
    - title: 'Locating data that can provide the answers'
      icon: 'Database'
    - title: 'Preparing raw data for rigorous analysis'
      icon: 'Hammer'
    - title: 'Interviewing prepared data to develop findings'
      icon: 'BarChart3'
    - title: 'Testing your findings against the real world'
      icon: 'Map'
    - title: 'Ensuring your subjects have a say'
      icon: 'MessageCircle'

